<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emoji Burst Typing</title>
    <style>
        :root {
            --bg-color: #f7f9fa;
            --text-muted: #93a5b5;
            --text-main: #2c3e50;
            --color-primary: #3498db;
            --color-accent: #85d7ff;
            --color-error: #e74c3c;
            --stat-label: #7f8c8d;
            --panel-bg: rgba(234, 238, 236, 0.9); 
        }

        [data-theme="dark"] {
            --bg-color: #181a1b;
            --text-muted: #4e5a65;
            --text-main: #f5f6f7;
            --color-primary: #2980b9;
            --color-accent: #00a8ff;
            --color-error: #e74c3c;
            --stat-label: #7f8c8d;
            --panel-bg: rgba(36, 39, 41, 0.9); 
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-muted);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow: hidden;
            position: relative;
            user-select: none;
            z-index: 1;
        }

        #top-bar {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            margin-bottom: 20px;
            z-index: 20;
        }

        .top-btn {
            background: none;
            border: 2px solid var(--text-muted);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .top-btn:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
        }

        /* 絞り込みフィルターパネル */
        #filter-panel {
            position: fixed;
            top: -500px; 
            left: 0;
            right: 0;
            background-color: var(--panel-bg);
            backdrop-filter: blur(8px);
            padding: 30px 20px 20px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: top 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 2px solid var(--color-primary);
        }
        #filter-panel.open {
            top: 0;
        }

        .panel-inner {
            max-width: 900px;
            width: 100%;
        }

        .filter-row {
            display: flex;
            align-items: flex-start;
            margin: 10px 0;
            gap: 10px;
        }
        .filter-label {
            width: 90px;
            text-align: right;
            font-size: 13px;
            font-weight: bold;
            color: var(--text-main);
            margin-top: 6px;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            flex: 1;
        }
        .filter-btn {
            background: none;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.1s ease;
        }
        .filter-btn.active {
            background-color: var(--color-primary);
            border-color: var(--color-primary);
            color: #fff;
        }
        .action-btn {
            background-color: transparent;
            border: 1px dashed var(--color-accent);
            color: var(--color-accent);
        }

        .slot-btn {
            border: 1px solid var(--text-main);
            color: var(--text-main);
            background-color: transparent;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .slot-btn.save:hover {
            background-color: #2ecc71;
            border-color: #2ecc71;
            color: white;
        }
        .slot-btn.load:hover {
            background-color: var(--color-primary);
            border-color: var(--color-primary);
            color: white;
        }
        .slot-unit {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0,0,0,0.05);
            padding: 4px 8px;
            border-radius: 6px;
        }

        #word-count-badge {
            font-size: 13px;
            font-weight: bold;
            color: var(--color-primary);
            align-self: center;
            margin-left: auto;
            background: rgba(52, 152, 219, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
        }

        /* レイヤー構造 */
        #game-bg-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 950px;
            height: 65vh;
            background-color: var(--panel-bg);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(4px);
            z-index: 10;
            pointer-events: none;
            transition: background-color 0.3s ease;
        }

        #game-container {
            max-width: 900px;
            width: 100%;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
        }

        #stats-container {
            display: flex;
            justify-content: center;
            gap: 45px;
            margin-bottom: 30px;
            font-size: 15px;
        }
        .stat-box { text-align: left; color: var(--stat-label); }
        .stat-value { font-size: 38px; color: var(--color-accent); font-weight: bold; }

        /* 横3単語 × 2行構成 */
        .line-container {
            font-size: 34px;
            letter-spacing: 2px;
            word-wrap: break-word;
            user-select: none;
            margin: 20px 0;
            min-height: 52px;
            line-height: 1.5;
        }
        #current-line {
            color: var(--text-main);
            font-size: 40px;
        }
        #next-line {
            color: var(--text-muted);
            font-size: 26px;
            opacity: 0.4;
        }

        .char-box {
            position: relative;
            display: inline;
            white-space: pre;
        }
        .correct { color: var(--text-muted); opacity: 0.35; }
        .incorrect { color: var(--color-error); border-bottom: 3px solid var(--color-error); }
        .current-char { color: var(--color-primary); border-left: 2px solid var(--color-primary); }

        #info { margin-top: 35px; font-size: 14px; color: var(--text-muted); min-height: 20px; }
        #version { position: absolute; bottom: 20px; font-size: 12px; color: var(--text-muted); opacity: 0.6; z-index: 20; }

        /* 🎆 エフェクト（背面） */
        .emoji-effect {
            position: fixed;
            font-size: 3.5rem;
            pointer-events: none;
            z-index: 5; 
            will-change: transform, opacity;
        }

        @keyframes float-up {
            0% { transform: translateY(105vh) translateX(0) scale(0.5); opacity: 0; }
            10% { opacity: 1; transform: translateY(90vh) translateX(var(--drift)) scale(1.2); }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) translateX(calc(var(--drift) * 2)) scale(1); opacity: 0; }
        }
        @keyframes rain-down {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(105vh) rotate(var(--spin)); opacity: 0; }
        }
        @keyframes cross-screen {
            0% { left: var(--start-x); transform: translateY(0) scale(1) var(--flip, scaleX(1)); opacity: 0; }
            10% { opacity: 1; }
            50% { transform: translateY(var(--wave-y)) scale(1.3) var(--flip, scaleX(1)); }
            90% { opacity: 1; }
            100% { left: var(--end-x); transform: translateY(0) scale(1) var(--flip, scaleX(1)); opacity: 0; }
        }
        @keyframes vortex-spin {
            0% { transform: translate(-50%, -50%) scale(0.1) rotate(0deg); top: 50vh; left: 50vw; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translate(calc(-50% + var(--vortex-x)), calc(-50% + var(--vortex-y))) scale(1.5) rotate(var(--vortex-rot)); top: 50vh; left: 50vw; opacity: 0; }
        }
        @keyframes zoom-splash {
            0% { transform: translate(-50%, -50%) scale(0.1) rotate(0deg); top: 50vh; left: 50vw; opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { transform: translate(calc(-50% + var(--move-x)), calc(-50% + var(--move-y))) scale(4) rotate(var(--spin)); top: 50vh; left: 50vw; opacity: 0; }
        }
    </style>
</head>
<body>

<div id="top-bar">
    <button id="settings-trigger" class="top-btn" onclick="toggleSettingsPanel(event)">⚙️ FILTERS</button>
    <button id="theme-toggle" class="top-btn" onclick="toggleTheme()">🌙 NIGHT MODE</button>
</div>

<div id="filter-panel" onclick="event.stopPropagation()">
    <div class="panel-inner">
        <div class="filter-row">
            <div class="filter-label">A - M :</div>
            <div class="btn-group" id="alpha-am-buttons"></div>
        </div>
        <div class="filter-row">
            <div class="filter-label">N - Z :</div>
            <div class="btn-group" id="alpha-nz-buttons"></div>
        </div>

        <!-- 🌟 新設：文字数フィルター（案C形式） -->
        <div class="filter-row">
            <div class="filter-label">LENGTH :</div>
            <div class="btn-group">
                <button id="len-std-btn" class="filter-btn active" onclick="toggleLengthFilter('std')">STANDARD (1-5)</button>
                <button id="len-exp-btn" class="filter-btn active" onclick="toggleLengthFilter('exp')">EXPANDED (6+)</button>
            </div>
        </div>

        <div class="filter-row" style="border-top: 1px dashed var(--text-muted); padding-top: 12px;">
            <div class="filter-label" style="margin-top: 8px;">PRESETS :</div>
            <div class="btn-group" id="save-slots-container"></div>
        </div>

        <div class="filter-row" style="margin-top: 12px; align-items: center;">
            <div id="word-count-badge">Words Available: 0</div>
            <div class="btn-group" style="justify-content: flex-end; flex: initial; margin-left: 15px;">
                <button class="filter-btn action-btn" onclick="setAllFilters(true)">ALL (全選択)</button>
                <button class="filter-btn action-btn" onclick="setAllFilters(false)">RESET (全解除)</button>
            </div>
        </div>
    </div>
</div>

<div id="game-bg-panel"></div>

<div id="game-container">
    <div id="stats-container">
        <div class="stat-box"><div>TIME</div><div id="stat-time" class="stat-value">0s</div></div>
        <div class="stat-box"><div>COMBO</div><div id="stat-combo" class="stat-value">0</div></div>
        <div class="stat-box"><div>KPM</div><div id="stat-kpm" class="stat-value">0</div></div>
        <div class="stat-box"><div>ACC</div><div id="stat-acc" class="stat-value">100%</div></div>
    </div>

    <!-- 2行構成（現在行 3単語 / 次行 3単語） -->
    <div id="current-line" class="line-container"></div>
    <div id="next-line" class="line-container"></div>
    
    <div id="info">Press any key to start typing!</div>
</div>

<div id="version">Emoji Burst Typing v1.10</div>

<script src="data.js"></script>

<script>
const rawPool = window.wordPool || [];

// === 1行=1単語:1絵文字の新形式に対応しつつ、同一単語の絵文字を自動集約 ===
const dictionaryMap = new Map();

rawPool.forEach(item => {
    if (!item.word) return;
    const wordKey = item.word.trim().toLowerCase();
    if (!wordKey) return;

    if (!dictionaryMap.has(wordKey)) {
        dictionaryMap.set(wordKey, {
            word: wordKey,
            emojis: [],
            effect: item.effect || "",
            facing: item.facing || ""
        });
    }

    const entry = dictionaryMap.get(wordKey);

    if (item.emoji && !entry.emojis.includes(item.emoji)) {
        entry.emojis.push(item.emoji);
    }
    if (Array.isArray(item.emojis)) {
        item.emojis.forEach(e => {
            if (e && !entry.emojis.includes(e)) entry.emojis.push(e);
        });
    }

    if (item.effect) entry.effect = item.effect;
    if (item.facing) entry.facing = item.facing;
});

const wordPool = Array.from(dictionaryMap.values());

const filterAlphabet = {
    am: ['a','b','c','d','e','f','g','h','i','j','k','l','m'],
    nz: ['n','o','p','q','r','s','t','u','v','w','x','y','z']
};

let activeChars = new Set([...filterAlphabet.am, ...filterAlphabet.nz]);

// 🌟 長さフィルターの状態（両方初期値 true）
let filterLength = {
    std: true, // 1〜5文字
    exp: true  // 6文字以上
};

let filteredWords = [];

// 横3単語の行管理
let currentLineWords = [];
let nextLineWords = [];
let currentLineSpans = []; 
let currentCharIndex = 0; 
let wordSegments = []; 
let hadMistakeInCurrentWord = false;

let comboCount = 0;
let correctTypeCount = 0; 
let incorrectTypeCount = 0; 
let startTime = null; 
let timerInterval = null;

function toggleSettingsPanel(event) {
    if (event) event.stopPropagation();
    const panel = document.getElementById("filter-panel");
    panel.classList.toggle("open");
}

function createFilterUI() {
    const amContainer = document.getElementById("alpha-am-buttons");
    const nzContainer = document.getElementById("alpha-nz-buttons");

    amContainer.innerHTML = "";
    nzContainer.innerHTML = "";

    const createBtn = (char, container) => {
        const btn = document.createElement("button");
        btn.id = "btn-char-" + char; 
        btn.className = "filter-btn active";
        btn.innerText = char.toUpperCase();
        btn.onclick = (e) => {
            e.stopPropagation();
            toggleCharFilter(char, btn);
        };
        container.appendChild(btn);
    };

    filterAlphabet.am.forEach(c => createBtn(c, amContainer));
    filterAlphabet.nz.forEach(c => createBtn(c, nzContainer));

    const slotContainer = document.getElementById("save-slots-container");
    slotContainer.innerHTML = "";
    for(let i = 1; i <= 5; i++) {
        const unit = document.createElement("div");
        unit.className = "slot-unit";
        unit.innerHTML = `
            <span style="font-size:12px; font-weight:bold; color:var(--text-main); margin-right:4px;">Set ${i}</span>
            <button class="slot-btn save" onclick="saveKeyPreset(${i}, event)">💾 Save</button>
            <button class="slot-btn load" onclick="loadKeyPreset(${i}, event)">📂 Load</button>
        `;
        slotContainer.appendChild(unit);
    }
}

// 🌟 長さフィルターのON/OFF切り替え
function toggleLengthFilter(type) {
    filterLength[type] = !filterLength[type];
    const btnId = type === 'std' ? 'len-std-btn' : 'len-exp-btn';
    const btn = document.getElementById(btnId);
    if (btn) btn.classList.toggle('active', filterLength[type]);
    onFilterChange();
}

function saveKeyPreset(slotId, event) {
    if (event) event.stopPropagation();
    const saveObj = {
        chars: Array.from(activeChars),
        length: filterLength
    };
    localStorage.setItem(`emoji_typing_slot_${slotId}`, JSON.stringify(saveObj));
    alert(`Saved to Set ${slotId}!`);
}

function loadKeyPreset(slotId, event) {
    if (event) event.stopPropagation();
    
    const savedData = localStorage.getItem(`emoji_typing_slot_${slotId}`);
    if (!savedData) {
        alert(`Set ${slotId} is empty! Please save your preset first.`);
        return;
    }
    
    const parsed = JSON.parse(savedData);
    
    // 互換性：配列なら文字のみ、オブジェクトなら文字+長さを復元
    if (Array.isArray(parsed)) {
        activeChars = new Set(parsed);
    } else {
        activeChars = new Set(parsed.chars || []);
        if (parsed.length) {
            filterLength = parsed.length;
            document.getElementById('len-std-btn').classList.toggle('active', filterLength.std);
            document.getElementById('len-exp-btn').classList.toggle('active', filterLength.exp);
        }
    }
    
    const allCharList = [...filterAlphabet.am, ...filterAlphabet.nz];
    allCharList.forEach(char => {
        const btn = document.getElementById("btn-char-" + char);
        if (btn) {
            btn.classList.toggle("active", activeChars.has(char));
        }
    });
    
    onFilterChange();
    document.getElementById("info").innerText = `Loaded Preset Set ${slotId}!`;
}

function toggleCharFilter(char, btn) {
    if (activeChars.has(char)) {
        activeChars.delete(char);
        btn.classList.remove("active");
    } else {
        activeChars.add(char);
        btn.classList.add("active");
    }
    onFilterChange();
}

function setAllFilters(isActive) {
    if (isActive) {
        activeChars = new Set([...filterAlphabet.am, ...filterAlphabet.nz]);
        filterLength.std = true;
        filterLength.exp = true;
    } else {
        activeChars.clear();
        filterLength.std = false;
        filterLength.exp = false;
    }
    
    const allCharList = [...filterAlphabet.am, ...filterAlphabet.nz];
    allCharList.forEach(char => {
        const btn = document.getElementById("btn-char-" + char);
        if (btn) btn.classList.toggle("active", isActive);
    });

    document.getElementById('len-std-btn').classList.toggle('active', filterLength.std);
    document.getElementById('len-exp-btn').classList.toggle('active', filterLength.exp);

    onFilterChange();
}

function onFilterChange() {
    filteredWords = wordPool.filter(item => {
        if (!item.word || item.word.length === 0) return false;
        const lowerWord = item.word.toLowerCase();
        const len = lowerWord.length;

        // 🌟 長さフィルター判定（掛け合わせ）
        const matchStd = filterLength.std && len <= 5;
        const matchExp = filterLength.exp && len >= 6;
        if (!matchStd && !matchExp) return false;

        // アルファベットホワイトリスト判定
        for (let i = 0; i < len; i++) {
            if (!activeChars.has(lowerWord.charAt(i))) {
                return false; 
            }
        }
        return true;
    });

    document.getElementById("word-count-badge").innerText = `Words Available: ${filteredWords.length}`;
    initGame();
}

function generateThreeWordLine() {
    if (filteredWords.length === 0) return [];
    const line = [];
    for (let i = 0; i < 3; i++) {
        const item = filteredWords[Math.floor(Math.random() * filteredWords.length)];
        line.push(item);
    }
    return line;
}

function initGame() {
    currentLineWords = generateThreeWordLine();
    nextLineWords = generateThreeWordLine();

    comboCount = 0;
    correctTypeCount = 0; 
    incorrectTypeCount = 0; 
    hadMistakeInCurrentWord = false;
    startTime = null; 
    if (timerInterval) clearInterval(timerInterval);
    
    document.getElementById("stat-time").innerText = "0s";
    document.getElementById("stat-combo").innerText = "0";
    document.getElementById("stat-kpm").innerText = "0";
    document.getElementById("stat-acc").innerText = "100%";

    if (currentLineWords.length === 0) {
        document.getElementById("info").innerText = "⚠️ No words can be formed with the active filters. Please select more letters.";
    } else {
        document.getElementById("info").innerText = "Press any key to start typing!";
    }
    renderLines();
}

function renderLines() {
    const currentContainer = document.getElementById("current-line");
    const nextContainer = document.getElementById("next-line");

    currentContainer.innerHTML = "";
    currentLineSpans = [];
    currentCharIndex = 0;
    wordSegments = [];
    hadMistakeInCurrentWord = false;

    if (currentLineWords.length === 0) {
        currentContainer.innerText = "";
        nextContainer.innerText = "";
        return;
    }

    nextContainer.innerText = nextLineWords.map(w => w.word).join(" ");

    let runningIndex = 0;
    currentLineWords.forEach((wordObj, wIndex) => {
        const wordText = wordObj.word;

        for (let i = 0; i < wordText.length; i++) {
            const span = document.createElement("span");
            span.innerText = wordText[i];
            span.className = "char-box";
            currentContainer.appendChild(span);
            currentLineSpans.push(span);
        }
        runningIndex += wordText.length;
        const wordEndIdx = runningIndex - 1;

        const spaceSpan = document.createElement("span");
        spaceSpan.innerText = " ";
        spaceSpan.className = "char-box";
        currentContainer.appendChild(spaceSpan);
        currentLineSpans.push(spaceSpan);
        const spaceIdx = runningIndex;
        runningIndex += 1;

        wordSegments.push({
            wordObj: wordObj,
            wordEndIndex: wordEndIdx,
            spaceIndex: spaceIdx,
            isLastWord: (wIndex === currentLineWords.length - 1)
        });
    });

    if (currentLineSpans.length > 0) {
        currentLineSpans[0].classList.add("current-char");
    }
}

function advanceLine() {
    currentLineWords = nextLineWords;
    nextLineWords = generateThreeWordLine();
    renderLines();
}

function updateStats() {
    if (!startTime) return;
    const elapsedSeconds = (Date.now() - startTime) / 1000;
    document.getElementById("stat-time").innerText = Math.floor(elapsedSeconds) + "s";
    let kpm = 0;
    if (elapsedSeconds > 0) kpm = Math.round(correctTypeCount / (elapsedSeconds / 60));
    document.getElementById("stat-kpm").innerText = kpm;
    const totalInput = correctTypeCount + incorrectTypeCount;
    document.getElementById("stat-acc").innerText = totalInput > 0 ? Math.round((correctTypeCount / totalInput) * 100) + "%" : "100%";
}

function toggleTheme() {
    const body = document.body; 
    const btn = document.getElementById("theme-toggle");
    if (body.getAttribute("data-theme") === "dark") { 
        body.removeAttribute("data-theme"); 
        btn.innerText = "🌙 NIGHT MODE"; 
    } else { 
        body.setAttribute("data-theme", "dark"); 
        btn.innerText = "☀️ LIGHT MODE"; 
    }
}

window.addEventListener("keydown", (e) => {
    if (e.key !== " " && e.key.length !== 1) return;
    if (e.key === " ") e.preventDefault();

    const pressedKey = e.key; 
    if (currentLineWords.length === 0 || currentCharIndex >= currentLineSpans.length) return;

    const panel = document.getElementById("filter-panel");
    if (panel.classList.contains("open")) {
        panel.classList.remove("open");
    }

    if (!startTime && currentLineWords.length > 0) {
        startTime = Date.now();
        document.getElementById("info").innerText = "Typing...";
        timerInterval = setInterval(updateStats, 200);
    }

    const targetChar = currentLineSpans[currentCharIndex].innerText;

    const isMatch = (targetChar === " " && pressedKey === " ") || 
                    (targetChar !== " " && pressedKey.toLowerCase() === targetChar.toLowerCase());

    if (isMatch) {
        correctTypeCount++;
        currentLineSpans[currentCharIndex].classList.remove("current-char", "incorrect");
        currentLineSpans[currentCharIndex].classList.add("correct");

        const completedWordSeg = wordSegments.find(seg => seg.wordEndIndex === currentCharIndex);
        if (completedWordSeg) {
            if (!hadMistakeInCurrentWord) {
                comboCount = Math.min(30, comboCount + 1);
            } else {
                comboCount = 0;
            }
            document.getElementById("stat-combo").innerText = comboCount;

            const wordObj = completedWordSeg.wordObj;
            if (wordObj.emojis && wordObj.emojis.length > 0) {
                triggerEmojiAnimation(wordObj.emojis, wordObj.effect, wordObj.facing, comboCount);
            }
            hadMistakeInCurrentWord = false;
        }

        const completedSpaceSeg = wordSegments.find(seg => seg.spaceIndex === currentCharIndex);
        if (completedSpaceSeg && completedSpaceSeg.isLastWord) {
            advanceLine();
            updateStats();
            return;
        }

        currentCharIndex++;

        if (currentCharIndex < currentLineSpans.length) {
            document.querySelectorAll(".char-box").forEach(el => el.classList.remove("current-char"));
            currentLineSpans[currentCharIndex].classList.add("current-char");
        }
    } else {
        incorrectTypeCount++;
        hadMistakeInCurrentWord = true;
        comboCount = 0;
        document.getElementById("stat-combo").innerText = comboCount;
        currentLineSpans[currentCharIndex].classList.add("incorrect");
    }
    updateStats();
});

// 🌟 ユーザー様設定を反映：下限3個 〜 最大33個
function triggerEmojiAnimation(emojiPool, specifiedEffect, facing, currentCombo) {
    let selectedType = "";
    const allTypes = ['up', 'rain', 'cross', 'vortex', 'zoom'];

    if (specifiedEffect && allTypes.includes(specifiedEffect)) {
        selectedType = specifiedEffect;
    }
    if (!selectedType) {
        selectedType = allTypes[Math.floor(Math.random() * allTypes.length)];
    }

    const spawnCount = Math.min(33, 3 + (currentCombo || 0));

    if (selectedType === 'up') {
        for (let i = 0; i < spawnCount; i++) {
            const randomEmoji = emojiPool[Math.floor(Math.random() * emojiPool.length)];
            setTimeout(() => {
                createEmojiElement(randomEmoji, {
                    animationName: 'float-up',
                    duration: 2 + Math.random() * 1.5 + 's',
                    left: 10 + Math.random() * 80 + 'vw',
                    customVars: { '--drift': (Math.random() - 0.5) * 250 + 'px' }
                });
            }, i * 60);
        }
    } 
    else if (selectedType === 'rain') {
        for (let i = 0; i < spawnCount; i++) {
            const randomEmoji = emojiPool[Math.floor(Math.random() * emojiPool.length)];
            setTimeout(() => {
                createEmojiElement(randomEmoji, {
                    animationName: 'rain-down',
                    duration: 1.5 + Math.random() * 2 + 's',
                    left: Math.random() * 100 + 'vw',
                    top: '-10vh',
                    customVars: { '--spin': (Math.random() > 0.5 ? 360 : -360) * (1 + Math.random() * 2) + 'deg' }
                });
            }, i * 50);
        }
    } 
    else if (selectedType === 'cross') {
        const goRight = Math.random() > 0.5;
        let flipValue = goRight ? 'scaleX(1)' : 'scaleX(-1)';
        if (facing === 'left') flipValue = goRight ? 'scaleX(-1)' : 'scaleX(1)';
        else if (facing === 'right') flipValue = goRight ? 'scaleX(1)' : 'scaleX(-1)';

        for (let i = 0; i < spawnCount; i++) {
            const randomEmoji = emojiPool[Math.floor(Math.random() * emojiPool.length)];
            setTimeout(() => {
                createEmojiElement(randomEmoji, {
                    animationName: 'cross-screen',
                    duration: 2.2 + Math.random() * 1.3 + 's',
                    top: 15 + Math.random() * 70 + 'vh',
                    customVars: {
                        '--start-x': goRight ? '-10vw' : '110vw',
                        '--end-x': goRight ? '110vw' : '-10vw',
                        '--wave-y': (Math.random() - 0.5) * 180 + 'px',
                        '--flip': flipValue
                    }
                });
            }, i * 70);
        }
    }
    else if (selectedType === 'vortex') {
        for (let i = 0; i < spawnCount; i++) {
            const randomEmoji = emojiPool[Math.floor(Math.random() * emojiPool.length)];
            const angle = (i * 0.35) + (Math.random() * 0.2); 
            const radius = 250 + Math.random() * 280; 
            const vx = Math.cos(angle) * radius + 'px';
            const vy = Math.sin(angle) * radius + 'px';

            setTimeout(() => {
                createEmojiElement(randomEmoji, {
                    animationName: 'vortex-spin',
                    duration: 1.1 + Math.random() * 0.5 + 's',
                    customVars: {
                        '--vortex-x': vx,
                        '--vortex-y': vy,
                        '--vortex-rot': (720 + Math.random() * 360) + 'deg'
                    }
                });
            }, i * 40); 
        }
    }
    else if (selectedType === 'zoom') {
        for (let i = 0; i < spawnCount; i++) {
            const randomEmoji = emojiPool[Math.floor(Math.random() * emojiPool.length)];
            const angle = Math.random() * Math.PI * 2;
            const distance = 200 + Math.random() * 300;
            const moveX = Math.cos(angle) * distance + 'px';
            const moveY = Math.sin(angle) * distance + 'px';

            setTimeout(() => {
                createEmojiElement(randomEmoji, {
                    animationName: 'zoom-splash',
                    duration: 0.7 + Math.random() * 0.5 + 's',
                    customVars: {
                        '--move-x': moveX,
                        '--move-y': moveY,
                        '--spin': (Math.random() - 0.5) * 720 + 'deg'
                    }
                });
            }, i * 35);
        }
    }
}

function createEmojiElement(emoji, config) {
    const el = document.createElement('div');
    el.className = 'emoji-effect';
    el.innerText = emoji;
    el.style.display = 'inline-block'; 
    
    if (config.left) el.style.left = config.left;
    if (config.top) el.style.top = config.top;
    if (config.customVars) {
        Object.keys(config.customVars).forEach(key => { el.style.setProperty(key, config.customVars[key]); });
    }
    el.style.animation = `${config.animationName} ${config.duration} cubic-bezier(0.1, 0.8, 0.3, 1) forwards`;
    document.body.appendChild(el);
    el.addEventListener('animationend', () => { el.remove(); });
}

createFilterUI();
onFilterChange();
